 match?</text><rect x="660" y="512" rx="4" width="200" height="44" stroke="#000000" stroke-width="1.3" fill="#FFEBEE"/><text x="760" y="540">Empty result</text><rect x="250" y="610" rx="4" width="300" height="44" stroke="#000000" stroke-width="1.3" fill="#FFFFFF"/><text x="400" y="638">Reciprocal rank fusion</text><rect x="250" y="678" rx="4" width="300" height="44" stroke="#000000" stroke-width="1.3" fill="#FFFFFF"/><text x="400" y="706">Deduplicate, keep top 6</text><rect x="250" y="746" rx="4" width="300" height="44" stroke="#000000" stroke-width="1.3" fill="#FFF3E0"/><text x="400" y="774">Ranked dishes to the worker</text><g stroke="#000000" stroke-width="1.4" fill="none"><path d="M400 64 400 86" marker-end="url(#rp)"/><path d="M400 134 400 156"/><path d="M240 156 560 156"/><path d="M240 156 240 176" marker-end="url(#rp)"/><path d="M560 156 560 176" marker-end="url(#rp)"/><path d="M240 224 240 244" marker-end="url(#rp)"/><path d="M560 224 560 244" marker-end="url(#rp)"/><path d="M240 292 240 312" marker-end="url(#rp)"/><path d="M560 292 560 312" marker-end="url(#rp)"/><path d="M240 360 240 384"/><path d="M560 360 560 384"/><path d="M240 384 560 384"/><path d="M400 384 400 404" marker-end="url(#rp)"/><path d="M400 452 400 472" marker-end="url(#rp)"/><path d="M400 592 400 606" marker-end="url(#rp)"/><path d="M400 654 400 674" marker-end="url(#rp)"/><path d="M400 722 400 742" marker-end="url(#rp)"/><path d="M545 534 656 534" marker-end="url(#rp)"/></g><circle cx="400" cy="156" r="3"/><circle cx="400" cy="384" r="3"/><text font-size="14" x="645" y="150">in parallel</text><text font-size="14" x="600" y="528">neither</text><text font-size="14" text-anchor="start" x="410" y="604">either passes</text></g></svg>