<svg width="900" height="790" viewBox="0 0 900 790" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><marker refX="8.5" refY="3.5" markerWidth="9" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse" id="ag" overflow="hidden"><path d="M0 0 9 3.5 0 7Z"/></marker></defs><rect x="0" y="0" width="900" height="790" fill="#FFFFFF"/><g font-family="Times New Roman,Times,Times New Roman" font-size="16" text-anchor="middle"><rect x="402" y="16" rx="17" width="96" height="34" stroke="#000000" stroke-width="1.3" fill="#FFFFFF"/><text x="450" y="39">START</text><rect x="290" y="74" rx="4" width="320" height="54" stroke="#000000" stroke-width="1.3" fill="#FFFFFF"/><text x="450" y="100">Classifier router</text><text font-size="13" x="450" y="119">trained MLP, 4 intents</text><rect x="60" y="192" rx="4" width="180" height="58" stroke="#000000" stroke-width="1.3" fill="#E1BEE7"/><text x="150" y="218">Order worker</text><text font-size="13" x="150" y="237">LLM → cart tool</text><rect x="260" y="192" rx="4" width="180" height="58" stroke="#000000" stroke-width="1.3" fill="#E1BEE7"/><text x="350" y="218">Search worker</text><text font-size="13" x="350" y="237">LLM → search tool</text><rect x="460" y="192" rx="4" width="180" height="58" stroke="#000000" stroke-width="1.3" fill="#FFFFFF"/><text x="550" y="218">Payment dispatch</text><text font-size="13" x="550" y="237">no LLM</text><rect x="660" y="192" rx="4" width="180" height="58" stroke="#000000" stroke-width="1.3" fill="#FFFFFF"/><text x="750" y="218">Chat worker</text><text font-size="13" x="750" y="237">no tool call</text><rect x="230" y="298" rx="4" width="440" height="54" stroke="#000000" stroke-width="1.6" fill="#FFFFFF"/><text x="450" y="324">Validator</text><text font-size="13" x="450" y="343">checks every tool argument against menu and state</text><rect x="310" y="378" rx="4" width="280" height="54" stroke="#000000" stroke-width="1.3" fill="#FFFFFF"/><text x="450" y="404">Tools</text><text font-size="13" x="450" y="423">executes the approved call</text><rect x="310" y="458" rx="4" width="280" height="54" stroke="#000000" stroke-width="1.3" fill="#FFFFFF"/><text x="450" y="484">State updater</text><text font-size="13" x="450" y="503">cart, stage, intent queue</text><rect x="310" y="538" rx="4" width="280" height="54" stroke="#000000" stroke-width="1.3" fill="#FFFFFF"/><text x="450" y="564">State outcome</text><text font-size="13" x="450" y="583">builds the response context</text><rect x="310" y="618" rx="4" width="280" height="54" stroke="#000000" stroke-width="1.3" fill="#E1BEE7"/><text x="450" y="644">Response node</text><text font-size="13" x="450" y="663">template or LLM</text><rect x="402" y="698" rx="17" width="96" height="34" stroke="#000000" stroke-width="1.3" fill="#FFFFFF"/><text x="450" y="721">END</text><g stroke="#000000" stroke-width="1.4" fill="none"><path d="M450 50 450 70" marker-end="url(#ag)"/><path d="M450 128 450 172"/><path d="M150 172 750 172"/><path d="M150 172 150 188" marker-end="url(#ag)"/><path d="M350 172 350 188" marker-end="url(#ag)"/><path d="M550 172 550 188" marker-end="url(#ag)"/><path d="M750 172 750 188" marker-end="url(#ag)"/></g><circle cx="450" cy="172" r="3"/><text font-size="13" x="643" y="165">one worker per intent</text><g stroke="#000000" stroke-width="1.4" fill="none"><path d="M150 250 150 274"/><path d="M350 250 350 274"/><path d="M550 250 550 274"/><path d="M150 274 550 274"/><path d="M450 274 450 294" marker-end="url(#ag)"/></g><circle cx="450" cy="274" r="3"/><text font-size="13" x="250" y="267">proposed tool call</text><g stroke="#000000" stroke-width="1.4" fill="none"><path d="M450 352 450 374" marker-end="url(#ag)"/><path d="M450 432 450 454" marker-end="url(#ag)"/><path d="M450 512 450 534" marker-end="url(#ag)"/><path d="M450 592 450 614" marker-end="url(#ag)"/><path d="M450 672 450 694" marker-end="url(#ag)"/></g><text font-size="13" text-anchor="start" x="460" y="368">approved</text><text font-size="13" text-anchor="start" x="460" y="528">queue empty</text><g stroke="#000000" stroke-width="1.4" fill="none"><path d="M230 325 32 325"/><path d="M310 485 32 485"/><path d="M32 485 32 140 446 140" marker-end="url(#ag)"/></g><circle cx="32" cy="325" r="3"/><circle cx="450" cy="140" r="3"/><text font-size="13" x="130" y="318">invalid, retry ≤ 3</text><text font-size="13" x="170" y="478">more intents</text><text font-size="13" x="165" y="134">back to the current worker</text><g stroke="#000000" stroke-width="1.4" fill="none"><path d="M670 325 716 325 716 558 594 558" marker-end="url(#ag)"/><path d="M840 221 866 221 866 582 594 582" marker-end="url(#ag)"/></g><text font-size="13" text-anchor="start" x="726" y="318">3 failures</text><text font-size="13" text-anchor="end" x="856" y="271">nothing to check</text><rect x="60" y="752" rx="3" width="20" height="15" stroke="#000000" fill="#E1BEE7"/><text font-size="13" text-anchor="start" x="88" y="765">calls the LLM</text><rect x="220" y="752" rx="3" width="20" height="15" stroke="#000000" fill="#FFFFFF"/><text font-size="13" text-anchor="start" x="248" y="765">deterministic Python</text></g></svg>