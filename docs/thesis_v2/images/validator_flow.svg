<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="884" viewBox="0 0 1120 884"><rect width="1120" height="884" fill="#FFFFFF"/><rect x="238.0" y="17.0" width="300" height="46" rx="23.0" ry="23.0" fill="#ECEFF1" stroke="#37474F" stroke-width="1.2"/><text x="388.0" y="40.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">Tool calls proposed by the worker</text><polygon points="388.0,88.0 574.0,146.0 388.0,204.0 202.0,146.0" fill="#FBE9E7" stroke="#37474F" stroke-width="1.2"/><text x="388.0" y="138.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">A cart change and a</text><text x="388.0" y="154.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">confirmation in one turn?</text><rect x="218.0" y="221.0" width="340" height="58" rx="3" ry="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.2"/><text x="388.0" y="250.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">Apply this tool's preconditions</text><polygon points="388.0,304.0 574.0,362.0 388.0,420.0 202.0,362.0" fill="#FBE9E7" stroke="#37474F" stroke-width="1.2"/><text x="388.0" y="354.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">Does the tool</text><text x="388.0" y="370.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">touch the cart?</text><polygon points="388.0,440.0 574.0,498.0 388.0,556.0 202.0,498.0" fill="#FBE9E7" stroke="#37474F" stroke-width="1.2"/><text x="388.0" y="498.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#212121" text-anchor="middle" dominant-baseline="central">Any errors?</text><rect x="218.0" y="583.0" width="340" height="58" rx="3" ry="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.2"/><text x="388.0" y="603.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Count the attempt and write</text><text x="388.0" y="620.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">feedback naming the problem</text><polygon points="388.0,660.0 574.0,718.0 388.0,776.0 202.0,718.0" fill="#FBE9E7" stroke="#37474F" stroke-width="1.2"/><text x="388.0" y="710.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">Third failure</text><text x="388.0" y="726.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">in a row?</text><rect x="686.0" y="115.0" width="340" height="62" rx="3" ry="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.2"/><text x="856.0" y="137.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Strip the confirmation and</text><text x="856.0" y="154.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">re-queue it behind the change</text><rect x="686.0" y="324.0" width="340" height="76" rx="3" ry="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.2"/><text x="856.0" y="345.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Resolve every name against the</text><text x="856.0" y="362.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">menu (Figure 4.6), then repair</text><text x="856.0" y="379.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">the cart</text><rect x="30.0" y="791.0" width="296" height="62" rx="31.0" ry="31.0" fill="#C8E6C9" stroke="#37474F" stroke-width="1.2"/><text x="178.0" y="813.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">Approved</text><text x="178.0" y="830.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#212121" text-anchor="middle" dominant-baseline="central">the tool node runs the call</text><rect x="412.0" y="791.0" width="296" height="62" rx="31.0" ry="31.0" fill="#FFF9C4" stroke="#37474F" stroke-width="1.2"/><text x="560.0" y="813.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">Back to the worker</text><text x="560.0" y="830.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#212121" text-anchor="middle" dominant-baseline="central">with the feedback</text><rect x="794.0" y="791.0" width="296" height="62" rx="31.0" ry="31.0" fill="#FFCDD2" stroke="#37474F" stroke-width="1.2"/><text x="942.0" y="813.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">Circuit breaker</text><text x="942.0" y="830.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#212121" text-anchor="middle" dominant-baseline="central">the guest hears an apology</text><path d="M 388.0 63.0 L 388.0 88.0" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="388.0,88.0 385.1,81.6 390.9,81.6" fill="#37474F"/><path d="M 388.0 204.0 L 388.0 221.0" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="388.0,221.0 385.1,214.6 390.9,214.6" fill="#37474F"/><rect x="376.5" y="203.5" width="23.0" height="18" fill="#FFFFFF" stroke="