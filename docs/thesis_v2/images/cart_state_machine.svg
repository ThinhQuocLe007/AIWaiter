<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700"><rect width="960" height="700" fill="#FFFFFF"/><circle cx="250" cy="50" r="9" fill="#37474F"/><rect x="100" y="87" width="300" height="66" rx="6" ry="6" fill="#C8E6C9" stroke="#37474F" stroke-width="1.2"/><text x="250.0" y="111.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">IDLE</text><text x="250.0" y="128.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">no items in the cart</text><rect x="100" y="297" width="300" height="66" rx="6" ry="6" fill="#FFE0B2" stroke="#37474F" stroke-width="1.2"/><text x="250.0" y="321.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">DRAFTING</text><text x="250.0" y="338.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#212121" text-anchor="middle" dominant-baseline="central">the cart holds items not read back yet</text><rect x="540" y="297" width="320" height="66" rx="6" ry="6" fill="#FFF9C4" stroke="#37474F" stroke-width="1.2"/><text x="700.0" y="321.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">AWAITING CONFIRMATION</text><text x="700.0" y="338.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">the cart has been read back to the guest</text><rect x="540" y="507" width="320" height="66" rx="6" ry="6" fill="#BBDEFB" stroke="#37474F" stroke-width="1.2"/><text x="700.0" y="531.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">CONFIRMED</text><text x="700.0" y="548.5" font-family="Deja