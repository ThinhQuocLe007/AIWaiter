" dominant-baseline="central" transform="rotate(-90 924 435)">another item is added</text><path d="M 700 573 L 700 637" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="700,637 697.1,630.6 702.9,630.6" fill="#37474F"/><rect x="706" y="583" width="115.10000000000001" height="18" fill="#FFFFFF" stroke="none"/><text x="710" y="592" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#455A64" text-anchor="start" dominant-baseline="central">payment verified,</text><rect x="706" y="599" width="121.4" height="18" fill="#FFFFFF" stroke="none"/><text x="710" y="608" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#455A64" text-anchor="start" dominant-baseline="central">the session closes</text></svg>