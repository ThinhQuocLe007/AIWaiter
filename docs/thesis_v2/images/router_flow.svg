<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830"><rect width="1000" height="830" fill="#FFFFFF"/><polygon points="187.0,15.0 529.0,15.0 493.0,61.0 151.0,61.0" fill="#FFFFFF" stroke="#37474F" stroke-width="1.2"/><text x="340" y="38" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">Utterance and conversation state</text><rect x="168" y="101" width="344" height="50" rx="3" ry="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.2"/><text x="340.0" y="126.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Vietnamese word segmentation</text><rect x="168" y="189" width="344" height="50" rx="3" ry="3" fill="#BBDEFB" stroke="#37474F" stroke-width="1.2"/><text x="340.0" y="214.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Bi-encoder: a 768-dimension vector</text><rect x="168" y="277" width="344" height="62" rx="3" ry="3" fill="#BBDEFB" stroke="#37474F" stroke-width="1.2"/><text x="340.0" y="300.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">MLP over the 768 inputs:</text><text x="340.0" y="316.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">a probability for each of four intents</text><path d="M 340 61 L 340 101" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="340,101 337.1,94.6 342.9,94.6" fill="#37474F"/><path d="M 340 151 L 340 189" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="340,189 337.1,182.6 342.9,182.6" fill="#37474F"/><path d="M 340 239 L 340 277" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="340,277 337.1,270.6 342.9,270.6" fill="#37474F"/><path d="M 340 339 L 340 368" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="340,368 337.1,361.6 342.9,361.6" fill="#37474F"/><polygon points="130,432 340,368 550,432 340,496" fill="#FBE9E7" stroke="#37474F" stroke-width="1.2"/><text x="340" y="416.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Confidence at or above its threshold</text><text x="340" y="432.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">(0.85 for SEARCH, 0.70 otherwise)</text><text x="340" y="448.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">and no clause-boundary marker?</text><path d="M 130 432 L 60 432 L 60 570" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="60,570 57.1,563.6 62.9,563.6" fill="#37474F"/><rect x="99.1" y="405" width="26.900000000000002" height="18" fill="#FFFFFF" stroke="none"/><text x="122" y="414" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#455A64" text-anchor="end" dominant-baseline="central">yes</text><rect x="15" y="570" width="280" height="60" rx="30.0" ry="30.0" fill="#C8E6C9" stroke="#37474F" stroke-width="1.2"/><text x="155.0" y="590.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">Fast path</text><text x="155.0" y="610.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#212121" text-anchor="middle" dominant-baseline="central">one intent, no model call</text><path d="M 550 432 L 760 432 L 760 570" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="760,570 757.1,563.6 762.9,563.6" fill="#37474F"/><rect x="554" y="405" width="20.6" height="18" fill="#FFFFFF" stroke="none"/><text x="558" y="414" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#455A64" text-anchor="start" dominant-baseline="central">no</text><rect x="600" y="570" width="320" height="60" rx="3" ry="3" fill="#E1BEE7" stroke="#37474F" stroke-width="1.2"/><text x="760.0" y="592.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Rewriter model splits the</text><text x="760.0" y="608.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">utterance into fragments</text><path d="M 760 630 L 760 668" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="760,668 757.1,661.6 762.9,661.6" fill="#37474F"/><rect x="600" y="668" width="320" height="50" rx="3" ry="3" fill="#BBDEFB" stroke="#37474F" stroke-width="1.2"/><text x="760.0" y="693.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Classify each fragment</text><path d="M 760 718 L 760 756" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="760,756 757.1,749.6 762.9,749.6" fill="#37474F"/><rect x="600" y="756" width="320" height="60" rx="30.0" ry="30.0" fill="#C8E6C9" stroke="#37474F" stroke-width="1.2"/><text x="760.0" y="776.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">Queue of intents</text><text x="760.0" y="796.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#212121" text-anchor="middle" dominant-baseline="central">worked through in order</text></svg>