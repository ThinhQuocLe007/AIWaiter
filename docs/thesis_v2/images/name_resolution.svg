<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1122" viewBox="0 0 1040 1122"><rect width="1040" height="1122" fill="#FFFFFF"/><polygon points="169.0,15.0 481.0,15.0 463.0,61.0 151.0,61.0" fill="#FFFFFF" stroke="#37474F" stroke-width="1.2"/><text x="316.0" y="38.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">The name as the model wrote it</text><rect x="146.0" y="98.0" width="340" height="68" rx="3" ry="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.2"/><text x="316.0" y="115.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Normalise both sides: lower case,</text><text x="316.0" y="132.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">strip diacritics, fold đ to d,</text><text x="316.0" y="149.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">collapse spaces</text><polygon points="316.0,196.0 496.0,250.0 316.0,304.0 136.0,250.0" fill="#FBE9E7" stroke="#37474F" stroke-width="1.2"/><text x="316.0" y="250.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#212121" text-anchor="middle" dominant-baseline="central">Exact match?</text><rect x="146.0" y="337.0" width="340" height="78" rx="3" ry="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.2"/><text x="316.0" y="359.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Candidates: menu names that begin</text><text x="316.0" y="376.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">with it; only if none, names that</text><text x="316.0" y="393.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">contain it anywhere</text><polygon points="316.0,450.0 460.0,496.0 316.0,542.0 172.0,496.0" fill="#FBE9E7" stroke="#37474F" stroke-width="1.2"/><text x="316.0" y="496.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">Exactly one?</text><polygon points="316.0,574.0 460.0,620.0 316.0,666.0 172.0,620.0" fill="#FBE9E7" stroke="#37474F" stroke-width="1.2"/><text x="316.0" y="620.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">More than one?</text><polygon points="316.0,690.0 496.0,744.0 316.0,798.0 136.0,744.0" fill="#FBE9E7" stroke="#37474F" stroke-width="1.2"/><text x="316.0" y="736.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">A trailing modifier</text><text x="316.0" y="752.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">to strip?</text><rect x="146.0" y="833.0" width="340" height="58" rx="3" ry="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.2"/><text x="316.0" y="853.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Nearest menu name by</text><text x="316.0" y="870.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Jaccard token similarity</text><polygon points="316.0,912.0 496.0,966.0 316.0,1020.0 136.0,966.0" fill="#FBE9E7" stroke="#37474F" stroke-width="1.2"/><text x="316.0" y="966.0" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#212121" text-anchor="middle" dominant-baseline="central">Similarity at least 0.3?</text><rect x="610.0" y="253.0" width="340" height="62" rx="31.0" ry="31.0" fill="#C8E6C9" stroke="#37474F" stroke-width="1.2"/><text x="780.0" y="275.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">Accepted</text><text x="780.0" y="292.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#212121" text-anchor="middle" dominant-baseline="central">the official name goes into the cart</text><rect x="610.0" y="589.0" width="340" height="62" rx="31.0" ry="31.0" fill="#FFF9C4" stroke="#37474F" stroke-width="1.2"/><text x="780.0" y="611.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">Ambiguous</text><text x="780.0" y="628.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#212121" text-anchor="middle" dominant-baseline="central">ask the guest which variant</text><rect x="610.0" y="935.0" width="340" height="62" rx="31.0" ry="31.0" fill="#FFCDD2" stroke="#37474F" stroke-width="1.2"/><text x="780.0" y="957.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">Not on the menu</text><text x="780.0" y="974.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#212121" text-anchor="middle" dominant-baseline="central">offer the nearest dish</text><rect x="610.0" y="1043.0" width="340" height="62" rx="31.0" ry="31.0" fill="#FFCDD2" stroke="#37474F" stroke-width="1.2"/><text x="780.0" y="1065.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle" dominant-baseline="central">Not on the menu</text><text x="780.0" y="1082.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#212121" text-anchor="middle" dominant-baseline="central">apologise, suggest nothing</text><rect x="610.0" y="711.0" width="340" height="66" rx="3" ry="3" fill="#FFFFFF" stroke="#37474F" stroke-width="1.2"/><text x="780.0" y="735.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">Strip it, keep it as a special request,</text><text x="780.0" y="752.5" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#212121" text-anchor="middle" dominant-baseline="central">then resolve the clean name again</text><path d="M 316.0 61.0 L 316.0 98.0" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="316.0,98.0 313.1,91.6 318.9,91.6" fill="#37474F"/><path d="M 316.0 166.0 L 316.0 196.0" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="316.0,196.0 313.1,189.6 318.9,189.6" fill="#37474F"/><path d="M 316.0 304.0 L 316.0 337.0" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="316.0,337.0 313.1,330.6 318.9,330.6" fill="#37474F"/><path d="M 316.0 415.0 L 316.0 450.0" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="316.0,450.0 313.1,443.6 318.9,443.6" fill="#37474F"/><path d="M 316.0 542.0 L 316.0 574.0" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="316.0,574.0 313.1,567.6 318.9,567.6" fill="#37474F"/><path d="M 316.0 666.0 L 316.0 690.0" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="316.0,690.0 313.1,683.6 318.9,683.6" fill="#37474F"/><path d="M 316.0 798.0 L 316.0 833.0" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="316.0,833.0 313.1,826.6 318.9,826.6" fill="#37474F"/><path d="M 316.0 891.0 L 316.0 912.0" fill="none" stroke="#37474F" stroke-width="1.2" stroke-linejoin="round"/><polygon points="316.0,912.0 313.1,905.6 318.9,905.6" fill="#37474F"/><rect x="304.5" y="311.5" width="23.0" height="18" fill="#FFFFFF" stroke="none"/><text x="316.0" y="320.5" font-family="DejaVu Sans, Verdana, sans-seri